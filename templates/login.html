<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Login | Fullventory AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #050505; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            background-image: radial-gradient(#1e1e1e 1px, transparent 1px); 
            background-size: 40px 40px;
        }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-field { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; }
        .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); outline: none; }
        .glow-btn { background: #2563eb; transition: all 0.3s ease; box-shadow: 0 0 20px rgba(37, 99, 235, 0.3); }
        .glow-btn:hover { background: #3b82f6; transform: translateY(-1px); box-shadow: 0 0 30px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="absolute w-[500px] h-[500px] bg-blue-600/10 blur-[120px] rounded-full -z-10"></div>

    <div class="glass w-full max-w-md p-10 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
        
        <div class="text-center mb-10">
            <div class="max-w-[1600px] mx-auto flex justify-between items-center">
            <div class="flex items-center mb-10">
                <img src="{{ url_for('static', filename='logo.png') }}" 
                    alt="Fullventory AI Logo" 
                    class="h-20 w-20 object-cover rounded-full border-2 border-white/10 hover:scale-110 transition-all duration-300" 
                    id="main-logo">
                </div>
            </div>
            <h1 class="text-3xl font-bold tracking-tighter mb-2">Manager <span class="text-blue-500">Login</span></h1>
            <p class="text-gray-500 text-xs uppercase tracking-[0.3em] font-medium">Access Predictive Command Center</p>
        </div>

        <div class="space-y-6">
            <div class="space-y-2">
                <label class="text-[10px] text-gray-500 uppercase font-bold ml-2 tracking-widest">Administrator ID</label>
                <input type="text" id="u" placeholder="Admin Username" 
                       class="input-field w-full rounded-xl p-4 text-sm text-white placeholder-gray-600">
            </div>

            <div class="space-y-2">
                <label class="text-[10px] text-gray-500 uppercase font-bold ml-2 tracking-widest">Access Key</label>
                <input type="password" id="p" placeholder="••••••••" 
                       class="input-field w-full rounded-xl p-4 text-sm text-white placeholder-gray-600">
            </div>

            <div id="err" class="text-red-400 text-[10px] font-bold uppercase tracking-widest text-center min-h-[1rem]"></div>

            <button onclick="doLogin()" id="loginBtn" class="glow-btn w-full py-4 rounded-xl font-bold text-sm tracking-widest uppercase flex items-center justify-center gap-2">
                Initialize Session
            </button>
        </div>

        <div class="mt-10 text-center">
            <a href="{{ url_for('landing') }}" class="text-[10px] text-gray-600 hover:text-blue-400 uppercase font-bold tracking-widest transition">← Return to Landing</a>
        </div>
    </div>

    <script>
        async function doLogin() {
            const btn = document.getElementById('loginBtn');
            const errDiv = document.getElementById('err');
            
            // Visual feedback
            btn.innerText = "Authenticating...";
            btn.disabled = true;
            btn.style.opacity = "0.7";
            errDiv.innerText = "";

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('u').value, 
                        password: document.getElementById('p').value
                    })
                });

                if(res.ok) {
                    btn.innerText = "Success. Redirecting...";
                    window.location.href = '/dashboard';
                } else {
                    errDiv.innerText = "ACCESS DENIED: INVALID CREDENTIALS";
                    btn.innerText = "Initialize Session";
                    btn.disabled = false;
                    btn.style.opacity = "1";
                }
            } catch (e) {
                errDiv.innerText = "SYSTEM ERROR: SERVER UNREACHABLE";
                btn.innerText = "Initialize Session";
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        }

        // Allow "Enter" key to submit
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
