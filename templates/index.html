<!DOCTYPE html>
<html>
<head>
    <title>Fullventory AI | Predictive Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Fullventory AI</h1>
            <div style="display:flex; gap:12px; align-items:center;">
                <input type="text" id="searchInput" placeholder="Search Item ID..." onkeyup="filterTable()">
                <a href="/api/report?store=all" class="btn-global">🌍 Global Report</a>
                <a href="/api/report" id="reportLink" class="btn-trend" style="text-decoration:none;">📥 Store Report</a>
                <a href="/api/logout" style="color:var(--danger); font-weight:700; text-decoration:none; margin-left:10px;">Logout</a>
            </div>
        </header>

        <div class="settings-box">
            <div style="flex:1;">
                <h4 style="margin:0 0 10px 0;">AI Inventory Strategy</h4>
                <div style="display:flex; gap:15px;">
                    <div><label>THRESHOLD (DAYS)</label><input type="number" id="threshIn"></div>
                    <div><label>REORDER QTY</label><input type="number" id="qtyIn"></div>
                    <button class="btn-primary" id="syncBtn" onclick="saveSettings()">Apply & Sync AI</button>
                </div>
            </div>
        </div>

        <div id="store-tabs" class="tabs-container"></div>

        <div class="table-card">
            <div class="table-header"><h3 id="table-title" style="margin:0;">Inventory Health Matrix</h3></div>
            <table>
                <thead>
                    <tr>
                        <th>Location</th>
                        <th>Item ID</th>
                        <th>Runway</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <div class="table-card" style="margin-top: 30px;">
            <div class="table-header"><h3 style="margin:0;">Fulfillment History</h3></div>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Item</th>
                        <th>Store</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>

    <div id="chartModal">
        <div class="modal-content">
            <span onclick="closeModal()" class="close-btn">&times;</span>
            <h3 id="modalTitle">Demand Analysis</h3>
            <div style="position: relative; height:40vh; width:100%;">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let inventoryData = []; 
        let currentStoreFilter = 'all'; 
        let myChart = null;

        async function init() { 
            await loadSettings(); 
            await loadInventory(); 
            await loadHistory(); 
        }

        async function loadSettings() {
            const res = await fetch('/api/settings');
            const data = await res.json();
            document.getElementById('threshIn').value = (data.threshold_days !== undefined) ? data.threshold_days : "";
            document.getElementById('qtyIn').value = (data.reorder_amount !== undefined) ? data.reorder_amount : "";
        }

        async function loadInventory() {
            const res = await fetch('/api/inventory'); 
            const result = await res.json();
            inventoryData = result.data;
            const stores = [...new Set(inventoryData.map(i => i.store))].sort((a,b) => a-b);
            if(currentStoreFilter === 'all' && stores.length > 0) currentStoreFilter = stores[0];
            generateStoreTabs(stores); 
            filterByStore(currentStoreFilter);
        }

        function generateStoreTabs(stores) {
            document.getElementById('store-tabs').innerHTML = stores.map(s => `
                <button id="tab-${s}" class="tab-btn ${currentStoreFilter == s ? 'active' : ''}" 
                        onclick="filterByStore(${s})">Store ${s}</button>
            `).join('');
        }

        function filterByStore(sid) {
            currentStoreFilter = sid;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`tab-${sid}`);
            if (activeBtn) activeBtn.classList.add('active');

            document.getElementById('reportLink').href = `/api/report?store=${sid}`;
            document.getElementById('reportLink').innerText = `📥 Store ${sid} Report`;
            document.getElementById('table-title').innerText = `Inventory Status: Store ${sid}`;
            filterTable();
        }

        function filterTable() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = inventoryData.filter(i => i.item.toString().includes(q) && i.store == currentStoreFilter);

            document.getElementById('table-body').innerHTML = filtered.map(item => `
                <tr>
                    <td>Store ${item.store}</td>
                    <td><code>#${item.item}</code></td>
                    <td>${item.days_left} Days</td>
                    <td><span class="status ${item.status.toLowerCase()}">${item.status}</span></td>
                    <td>
                        <button class="btn-trend" onclick="showTrends(${item.store}, ${item.item})">Analyze</button>
                        ${item.status === 'CRITICAL' ? `<button class="btn-order" onclick="orderItem(${item.item}, ${item.store})">Restock</button>` : ''}
                    </td>
                </tr>`).join('');
        }

        async function saveSettings() {
            const btn = document.getElementById('syncBtn');
            const t = document.getElementById('threshIn').value;
            const q = document.getElementById('qtyIn').value;
            if(!t || !q) { alert("Please enter both Threshold and Quantity."); return; }
            btn.innerText = "Syncing AI..."; btn.disabled = true;
            try {
                const response = await fetch('/api/settings', { 
                    method:'POST', 
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({threshold_days: t, reorder_amount: q})
                });
                if(response.ok) { await loadInventory(); alert("AI Sync Complete!"); }
            } finally { btn.innerText = "Apply & Sync AI"; btn.disabled = false; }
        }

        async function loadHistory() {
            const res = await fetch('/api/history'); 
            const result = await res.json();
            document.getElementById('history-body').innerHTML = result.data.map(h => `
                <tr>
                    <td>${h.date}</td><td>#${h.item}</td><td>Store ${h.store}</td>
                    <td>${h.status === 'PENDING' ? `<button class="btn-primary" onclick="receiveItem(${h.id})">Receive</button>` : '<span style="color:var(--success); font-weight:700;">Completed</span>'}</td>
                </tr>`).join('');
        }

        async function showTrends(sid, iid) {
            document.getElementById('chartModal').classList.add('active');
            
            // Wait for modal animation to finish before drawing
            setTimeout(async () => {
                const res = await fetch(`/api/trends/${sid}/${iid}`); 
                const result = await res.json();
                const ctx = document.getElementById('trendChart').getContext('2d');
                if(myChart) myChart.destroy();
                
                myChart = new Chart(ctx, { 
                    type: 'line', 
                    data: { 
                        labels: result.labels, 
                        datasets: [{
                            label: 'Daily Sales', 
                            data: result.values, 
                            borderColor: '#4f46e5', 
                            fill: true, 
                            backgroundColor: 'rgba(79, 70, 229, 0.1)',
                            tension: 0.4
                        }] 
                    }, 
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }, 300);
        }

        async function orderItem(iid, sid) { 
            if(confirm('Place restock order?')) { 
                await fetch('/api/order', {
                    method:'POST', 
                    headers:{'Content-Type':'application/json'}, 
                    body:JSON.stringify({item_id:iid, store_id:sid})
                }); 
                init(); 
            } 
        }

        async function receiveItem(oid) { 
            await fetch('/api/receive', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({order_id:oid})}); 
            init(); 
        }

        function closeModal() { document.getElementById('chartModal').classList.remove('active'); }
        init();
    </script>
</body>
</html>
